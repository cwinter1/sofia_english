<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="האנגלית">
<title>האנגלית של סופיה</title>
<style>
:root{--bg:#eefaff;--card:#fff;--ink:#1f3a4d;--pri:#1d9bd8;--pri2:#8fd3f4;--ok:#00b894;--bad:#e17055;--warn:#fdcb6e;--soft:#e0f4fd}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
button{font-family:inherit;touch-action:manipulation;-webkit-user-select:none;user-select:none;cursor:pointer}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Segoe UI",Arial,sans-serif;min-height:100vh}
.en{direction:ltr;unicode-bidi:isolate;display:inline-block}
header{display:flex;align-items:center;justify-content:space-between;padding:calc(12px + env(safe-area-inset-top)) 16px 12px;background:var(--pri);color:#fff}
header h1{font-size:1.2rem;margin:0}
#stars{background:#fff;color:var(--pri);border-radius:20px;padding:4px 14px;font-weight:700;font-size:1.1rem}
#stars.pop{animation:pop .5s}
@keyframes pop{50%{transform:scale(1.35)}}
main{max-width:760px;margin:0 auto;padding:14px 14px 60px}
h2{font-size:1.05rem;margin:22px 4px 8px;color:var(--pri)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:4px 0 4px}
.chip{border:2px solid var(--pri2);background:#fff;color:var(--pri);border-radius:18px;padding:6px 14px;font-size:1rem}
.chip.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.tile{background:var(--card);border:2px solid var(--pri2);border-radius:16px;padding:14px 8px;font-size:1rem;color:var(--ink);text-align:center;font-weight:600;min-height:92px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.tile:active{transform:scale(.97)}
.tile .ic{font-size:1.9rem}
.tile small{font-weight:400;opacity:.7}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.back{border:0;background:var(--soft);border-radius:12px;padding:8px 14px;font-size:1.1rem}
.bar2{height:8px;background:var(--soft);border-radius:6px;overflow:hidden;margin-bottom:14px}
.bar2 i{display:block;height:100%;background:var(--ok);transition:width .3s}
.card{background:var(--card);border-radius:18px;padding:18px;text-align:center;box-shadow:0 2px 8px #1d9bd822}
.q{min-height:140px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px}
.prompt{font-size:1.9rem;font-weight:700}
.hint{font-size:.95rem;opacity:.7}
.spk{border:0;background:var(--soft);border-radius:50%;width:48px;height:48px;font-size:1.4rem}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.opt{border:2px solid var(--pri2);background:#fff;border-radius:14px;padding:16px 8px;font-size:1.25rem;color:var(--ink);font-weight:600}
.opt.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.bad{background:var(--bad);border-color:var(--bad);color:#fff;animation:shake .35s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.shake{animation:shake .35s}
.btn{border:0;background:var(--pri);color:#fff;border-radius:14px;padding:12px 22px;font-size:1.1rem;font-weight:700;margin:6px}
.btn.alt{background:var(--soft);color:var(--pri)}
.center{text-align:center}
.big{font-size:4rem}
.panda{display:inline-block;animation:jump .6s ease-in-out infinite}
@keyframes jump{50%{transform:translateY(-22px)}}
.toast{position:fixed;left:50%;bottom:calc(60px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ok);color:#fff;padding:10px 22px;border-radius:24px;font-weight:700;font-size:1.2rem;z-index:20;pointer-events:none;animation:tin 1s ease-out forwards}
@keyframes tin{0%{opacity:0;transform:translate(-50%,30px)}15%{opacity:1;transform:translate(-50%,0)}80%{opacity:1}100%{opacity:0}}
.flash{min-height:200px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;font-size:2.2rem;font-weight:700;border:3px solid var(--pri2);cursor:pointer}
.flash.back2{background:var(--soft)}
.slots{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;direction:ltr;margin:10px 0}
.slot{min-width:38px;height:48px;border-bottom:4px solid var(--pri2);font-size:1.7rem;font-weight:700;display:flex;align-items:center;justify-content:center;color:var(--ok)}
.slot.gap{border:0;min-width:16px}
.letters{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;direction:ltr;margin-top:14px}
.lt{min-width:48px;height:52px;border:2px solid var(--pri2);background:#fff;border-radius:12px;font-size:1.5rem;font-weight:700;color:var(--ink)}
.lt:disabled{opacity:.2}
.ans{min-height:64px;border:2px dashed var(--pri2);border-radius:14px;padding:8px;display:flex;gap:8px;flex-wrap:wrap;direction:ltr;align-items:center;margin:12px 0;background:#fff}
.wd{border:2px solid var(--pri);background:var(--soft);border-radius:12px;padding:10px 14px;font-size:1.2rem;font-weight:600;color:var(--ink);direction:ltr}
.mem{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.mc{height:84px;border:2px solid var(--pri2);border-radius:14px;background:var(--pri);color:var(--pri);font-size:1.05rem;font-weight:700;padding:4px;display:flex;align-items:center;justify-content:center;text-align:center}
.mc.up{background:#fff;color:var(--ink)}
.mc.done{background:var(--ok);color:#fff;border-color:var(--ok)}
table{border-collapse:collapse;width:100%;margin:6px 0}
td,th{border:1px solid var(--pri2);padding:8px;text-align:center;background:#fff}
th{background:var(--soft)}
@media(max-width:380px){.prompt{font-size:1.5rem}.opt{font-size:1.05rem}}
</style>
</head>
<body>
<header><h1>🐼 האנגלית של סופיה</h1><div id="stars">⭐ 0</div></header>
<main id="app"></main>
<script>
/* ---------- data ---------- */
const N=[['one',1],['two',2],['three',3],['four',4],['five',5],['six',6],['seven',7],['eight',8],['nine',9],['ten',10],['eleven',11],['twelve',12],['thirteen',13],['fourteen',14],['fifteen',15],['sixteen',16],['seventeen',17],['eighteen',18],['nineteen',19],['twenty',20],['thirty',30],['forty',40],['fifty',50],['sixty',60],['seventy',70],['eighty',80],['ninety',90],['a hundred',100]];
const M=[['January','ינואר'],['February','פברואר'],['March','מרץ'],['April','אפריל'],['May','מאי'],['June','יוני'],['July','יולי'],['August','אוגוסט'],['September','ספטמבר'],['October','אוקטובר'],['November','נובמבר'],['December','דצמבר']];
const W0=[['a lot of','הרבה'],['age','גיל'],['also','גם'],['always','תמיד'],['at night','בלילה'],['beautiful','יפה'],['because','כי'],['begin','להתחיל'],['best','הכי טוב'],['better','טוב יותר'],['birthday','יום הולדת'],['break','הפסקה / לשבור'],['but','אבל'],['call','לקרוא / להתקשר'],['closed','סגור'],['cry','לבכות'],['different','שונה'],['every','כל'],['fast','מהיר'],['find','למצוא'],['first','ראשון'],['flower','פרח'],['for','בשביל'],['give','לתת'],['hard','קשה'],['help','לעזור'],["I'm sorry","אני מצטערת"],['idea','רעיון'],['if','אם'],['important','חשוב'],['into','לתוך'],['kid','ילד'],['learn','ללמוד'],['like','לאהוב / כמו'],['money','כסף'],['month','חודש'],['more','עוד'],['near','קרוב'],['next','הבא'],['nice','נחמד'],['now','עכשיו'],['old','ישן / זקן'],['other','אחר'],['people','אנשים'],['perhaps','אולי'],['put','לשים'],['road','כביש'],['sick','חולה'],['special','מיוחד'],['tell a story','לספר סיפור'],['the same','אותו דבר'],['their','שלהם'],['time','זמן / שעה'],['together','ביחד'],['too','מדי'],['use','להשתמש'],['wait','לחכות'],['wash','לשטוף'],['with','עם'],['year','שנה'],['young','צעיר'],['blanket','שמיכה'],['brush','מברשת'],['chess','שחמט'],['choose','לבחור'],['hobby','תחביב'],['information','מידע'],['look for','לחפש'],['pool','בריכה'],['race','מרוץ'],['secret','סוד'],['take care of','לטפל ב'],['team','קבוצה'],['toy','צעצוע'],['win','לנצח']];
const WORDS=[...W0.map(([en,he])=>({en,he,cat:'w'})),...N.map(([en,n])=>({en,he:String(n),cat:'n'})),...M.map(([en,he])=>({en,he,cat:'m'}))];
const CATS=[['all','הכל'],['w','מילים'],['n','מספרים'],['m','חודשים']];
const SENT=[
['He has good friends.','יש לו חברים טובים.'],['I have blue eyes.','יש לי עיניים כחולות.'],['It has special food.','יש לו אוכל מיוחד.'],
['You have an old computer.','יש לך מחשב ישן.'],['You have black hair.','יש לך שיער שחור.'],['We have a big class.','יש לנו כיתה גדולה.'],
['She has a new bike.','יש לה אופניים חדשים.'],['They have a big house.','יש להם בית גדול.'],['We have a new teacher.','יש לנו מורה חדש.'],
['My friend has a white bag.','לחבר שלי יש תיק לבן.'],['My brother and sister have brown eyes.','לאח ולאחות שלי יש עיניים חומות.'],
['You have a beautiful bike.','יש לך אופניים יפים.'],['Diana has three pencils.','לדיאנה יש שלושה עפרונות.'],['The pupils have homework.','לתלמידים יש שיעורי בית.'],
['I have two cats.','יש לי שני חתולים.'],['She has a hobby.','יש לה תחביב.'],['He has a blue blanket.','יש לו שמיכה כחולה.'],
['You are at school.','את בבית הספר.'],['She is my sister.','היא אחותי.'],['I am a pupil.','אני תלמידה.'],['They are 10 years old.','הם בני 10.'],
['He is my friend.','הוא החבר שלי.'],['We are at the park.','אנחנו בפארק.'],['It is my bag.','זה התיק שלי.'],['You are a teacher.','את מורה.'],
['She is in 5th grade.','היא בכיתה ה׳.'],['I am happy.','אני שמחה.'],['The teacher is nice.','המורה נחמד.'],['My school is big.','בית הספר שלי גדול.'],
['The kids are at the pool.','הילדים בבריכה.'],['We are a team.','אנחנו קבוצה.'],['It is a secret.','זה סוד.'],['He is sick.','הוא חולה.'],
['The flowers are beautiful.','הפרחים יפים.'],['You are my best friend.','את החברה הכי טובה שלי.']
].map(([en,he])=>({en,he,verb:(en.match(/\b(am|is|are|have|has)\b/)||[])[1]}));
const SUBJ=[['I','1'],['you','2'],['we','p'],['they','p'],['he','3'],['she','3'],['it','3'],['the teacher','3'],['the pupils','p'],['Joe and I','p'],['animals','p'],['my school','3'],['my friend','3'],['Diana','3'],['my brother and sister','p']];
const SF=[['I am',"I'm"],['He is',"He's"],['She is',"She's"],['It is',"It's"],['We are',"We're"],['You are',"You're"],['They are',"They're"]];
const PRAISE=['יפה מאוד! 🎉','כל הכבוד! ⭐','מצוין! 👏','וואו! 🌟','נכון! 💪','סופיה אלופה! 🏆'];

/* ---------- helpers ---------- */
const app=document.getElementById('app');
let stars=0;try{stars=+localStorage.getItem('sofia_stars')||0}catch(e){}
let CAT='all';
const rnd=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
function drawStars(){const s=document.getElementById('stars');s.textContent='⭐ '+stars}
function addStar(n=1){stars+=n;try{localStorage.setItem('sofia_stars',stars)}catch(e){}drawStars();const s=document.getElementById('stars');s.classList.remove('pop');void s.offsetWidth;s.classList.add('pop')}
let VOICES=[],UT=[],unlocked=false,warned=false;
function loadVoices(){try{VOICES=speechSynthesis.getVoices()||[]}catch(e){}}
try{loadVoices();speechSynthesis.onvoiceschanged=loadVoices}catch(e){}
document.addEventListener('pointerdown',()=>{if(unlocked)return;unlocked=true;try{const u=new SpeechSynthesisUtterance(' ');u.volume=0;speechSynthesis.speak(u)}catch(e){}},true);
const AU=new Audio();AU.preload='auto';
const slug=t=>t.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
function speak(t){
  try{AU.pause();AU.onerror=()=>tts(t);AU.src='audio/'+slug(t)+'.mp3';const p=AU.play();if(p&&p.catch)p.catch(()=>tts(t))}catch(e){tts(t)}}
function tts(t){
  if(!('speechSynthesis' in window)||typeof SpeechSynthesisUtterance==='undefined'){if(!warned){warned=true;toast('הדפדפן לא תומך בקול')}return}
  try{
    const ss=speechSynthesis;loadVoices();
    if(ss.speaking||ss.pending)ss.cancel();
    if(ss.paused)ss.resume();
    setTimeout(()=>{
      const u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=.85;u.volume=1;
      const en=VOICES.filter(v=>/^en/i.test((v.lang||'').replace('_','-')));
      const v=en.find(v=>(v.lang||'').replace('_','-')==='en-US')||en[0];
      if(v)u.voice=v;
      else if(VOICES.length&&!warned){warned=true;toast('אין קול באנגלית במכשיר')}
      UT.push(u);u.onend=u.onerror=()=>{UT=UT.filter(x=>x!==u)};
      ss.speak(u)},80);
  }catch(e){}}
function toast(t){const d=document.createElement('div');d.className='toast';d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),1000)}
const pool=c=>WORDS.filter(w=>(c||CAT)==='all'||w.cat===(c||CAT));
const topbar=(title,right='')=>`<div class="top"><button class="back" id="bk">🏠</button><b>${title}</b><span>${right}</span></div>`;
function bindBack(){const b=document.getElementById('bk');if(b)b.onclick=home}
function finish(title,good,total,again){
  app.innerHTML=`${topbar(title)}<div class="card center"><div class="big panda">🐼</div><h2 style="color:var(--ink)">סיימת!</h2><p>⭐ ${good} מתוך ${total} בניסיון הראשון</p><button class="btn" id="ag">שוב</button><button class="btn alt" id="hm">תפריט</button></div>`;
  bindBack();document.getElementById('ag').onclick=again;document.getElementById('hm').onclick=home}
const enSpan=t=>`<span class="en">${t}</span>`;

/* ---------- generic multiple choice ---------- */
function runChoice(title,gen){
  const qs=gen();const total=qs.length;let queue=qs.map(q=>({...q,tries:0,copy:false,pushed:false})),done=0,good=0,locked=false;
  function show(){
    if(!queue.length)return finish(title,good,total,()=>runChoice(title,gen));
    const q=queue[0];locked=false;
    app.innerHTML=`${topbar(title,done+'/'+total)}<div class="bar2"><i style="width:${done/total*100}%"></i></div>
    <div class="card q">${q.hint?`<div class="hint">${q.hint}</div>`:''}<div class="prompt">${q.pen?enSpan(q.prompt):q.prompt}</div>${q.say?'<button class="spk" id="sp">🔊</button>':''}</div>
    <div class="opts">${q.options.map((o,k)=>`<button class="opt" data-k="${k}">${q.oen?enSpan(o):o}</button>`).join('')}</div>`;
    bindBack();
    if(q.say){document.getElementById('sp').onclick=()=>speak(q.say);speak(q.say)}
    app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
      if(locked)return;const o=q.options[+b.dataset.k];
      if(o===q.answer){locked=true;b.classList.add('ok');
        if(!q.copy){done++;if(q.tries===0){good++;addStar()}}
        toast(rnd(PRAISE));setTimeout(()=>{queue.shift();show()},850)}
      else{b.classList.add('bad');b.disabled=true;q.tries++;
        if(!q.pushed&&!q.copy){q.pushed=true;queue.push({...q,copy:true,pushed:true,tries:1})}}
    });
  }
  show();
}
function distract(w,key,n=3){
  const c=pool('all').filter(x=>x!==w&&x[key]!==w[key]);
  const sc=x=>(x.en.slice(0,3)===w.en.slice(0,3)?2:0)+(x.cat===w.cat?1.5:0)+Math.random();
  const out=[],seen=new Set([w[key]]);
  for(const x of c.sort((a,b)=>sc(b)-sc(a))){if(!seen.has(x[key])){seen.add(x[key]);out.push(x[key])}if(out.length>=n)break}
  return out}
function wordQuiz(cat){
  runChoice('חידון מילים',()=>shuffle(pool(cat)).slice(0,10).map(w=>{
    if(Math.random()<.5)return{prompt:w.en,pen:true,say:w.en,hint:'מה הפירוש?',options:shuffle([w.he,...distract(w,'he')]),answer:w.he};
    return{prompt:w.he,hint:'איך אומרים באנגלית?',options:shuffle([w.en,...distract(w,'en')]),oen:true,answer:w.en}}));
}
function circle(fam,title){
  const verbs=fam==='have'?['have','has']:['am','is','are'];
  runChoice(title,()=>shuffle(SENT.filter(s=>verbs.includes(s.verb))).slice(0,10).map(s=>({
    prompt:s.en.replace(new RegExp('\\b'+s.verb+'\\b'),'_____'),pen:true,hint:s.he,options:verbs,oen:true,answer:s.verb})));
}
function sortGame(fam,title){
  const verb=(t)=>fam==='have'?(t==='3'?'has':'have'):(t==='1'?'am':t==='3'?'is':'are');
  const verbs=fam==='have'?['have','has']:['am','is','are'];
  runChoice(title,()=>shuffle(SUBJ).slice(0,12).map(([s,t])=>({
    prompt:s+' _____',pen:true,hint:'איזו מילה מתאימה?',options:verbs,oen:true,answer:verb(t)})));
}
function shortForms(){
  const opts=(all,ans)=>shuffle([ans,...shuffle(all.filter(x=>x!==ans)).slice(0,3)]);
  runChoice('צורות מקוצרות',()=>shuffle(SF.concat(SF)).slice(0,10).map(([f,s])=>{
    if(Math.random()<.5)return{prompt:f,pen:true,hint:'איך כותבים בקיצור?',options:opts(SF.map(x=>x[1]),s),oen:true,answer:s};
    return{prompt:s,pen:true,hint:'מה הצורה המלאה?',options:opts(SF.map(x=>x[0]),f),oen:true,answer:f}}));
}
function translateGame(){
  runChoice('תרגמו את המשפט',()=>shuffle(SENT).slice(0,10).map(s=>({
    prompt:s.en,pen:true,say:s.en,hint:'מה התרגום?',
    options:shuffle([s.he,...shuffle(SENT.filter(x=>x.he!==s.he)).slice(0,2).map(x=>x.he)]),answer:s.he})));
}

/* ---------- flashcards ---------- */
function flashcards(cat){
  let deck=shuffle(pool(cat)).slice(0,15),flipped=false,total=deck.length,known=0,seen=new Set();
  function show(){
    if(!deck.length)return finish('כרטיסיות',known,total,()=>flashcards(cat));
    const w=deck[0];
    app.innerHTML=`${topbar('כרטיסיות',known+'/'+total)}<div class="bar2"><i style="width:${known/total*100}%"></i></div>
    <div class="card flash ${flipped?'back2':''}" id="fc">${flipped?`<div>${w.he}</div><div class="hint">לחצו להפוך</div>`:`${enSpan(w.en)}<button class="spk" id="sp">🔊</button><div class="hint">לחצו לראות תרגום</div>`}</div>
    <div class="center" style="margin-top:14px"><button class="btn alt" id="no">↻ עוד פעם</button><button class="btn" id="yes">✓ ידעתי</button></div>`;
    bindBack();
    const sp=document.getElementById('sp');if(sp)sp.onclick=e=>{e.stopPropagation();speak(w.en)};
    if(!flipped)speak(w.en);
    document.getElementById('fc').onclick=()=>{flipped=!flipped;show()};
    document.getElementById('yes').onclick=()=>{deck.shift();known++;if(!seen.has(w.en))addStar();flipped=false;show()};
    document.getElementById('no').onclick=()=>{seen.add(w.en);deck.push(deck.shift());flipped=false;show()};
  }
  show();
}

/* ---------- spelling ---------- */
function spell(cat){
  const list=shuffle(pool(cat).filter(w=>/^[A-Za-z]+$/.test(w.en))).slice(0,8);let i=0,good=0;
  function next(){
    if(i>=list.length)return finish('איות',good,list.length,()=>spell(cat));
    const w=list[i],chars=[...w.en],lower=chars.map(c=>c.toLowerCase());let pos=0,mistakes=0;
    let order=shuffle(chars.map((c,k)=>k));if(chars.length>2){let t=0;while(order.every((o,k)=>o===k)&&t++<5)order=shuffle(order)}
    app.innerHTML=`${topbar('איות',(i+1)+'/'+list.length)}<div class="bar2"><i style="width:${i/list.length*100}%"></i></div>
    <div class="card q"><div class="hint">הקשיבו ואיתו את המילה</div><div class="prompt">${w.he}</div><button class="spk" id="sp">🔊</button></div>
    <div class="slots" id="slots">${chars.map(()=>'<div class="slot"></div>').join('')}</div>
    <div class="letters" id="lts">${order.map(k=>`<button class="lt" data-k="${k}">${chars[k]}</button>`).join('')}</div>`;
    bindBack();document.getElementById('sp').onclick=()=>speak(w.en);speak(w.en);
    const slots=app.querySelectorAll('.slot');
    app.querySelectorAll('.lt').forEach(b=>b.onclick=()=>{
      const k=+b.dataset.k;
      if(lower[k]===lower[pos]){slots[pos].textContent=chars[k];b.disabled=true;pos++;
        if(pos===chars.length){if(!mistakes){good++;addStar()}toast(rnd(PRAISE));speak(w.en);setTimeout(()=>{i++;next()},1100)}}
      else{mistakes++;b.classList.add('shake');setTimeout(()=>b.classList.remove('shake'),400)}
    });
  }
  next();
}

/* ---------- memory ---------- */
function memory(cat){
  const ws=shuffle(pool(cat)).slice(0,6);
  const cards=shuffle(ws.flatMap((w,k)=>[{k,t:w.en,en:true},{k,t:w.he,en:false}]));
  let open=[],matched=0,busy=false,moves=0;
  app.innerHTML=`${topbar('זיכרון','')}<p class="center hint">מצאו זוגות: מילה באנגלית ותרגום</p><div class="mem" id="mm">${cards.map((c,i)=>`<button class="mc" data-i="${i}">?</button>`).join('')}</div>`;
  bindBack();
  const btns=app.querySelectorAll('.mc');
  btns.forEach(b=>b.onclick=()=>{
    const i=+b.dataset.i,c=cards[i];
    if(busy||b.classList.contains('up')||b.classList.contains('done'))return;
    b.classList.add('up');b.innerHTML=c.en?enSpan(c.t):c.t;if(c.en)speak(c.t);open.push(i);
    if(open.length===2){moves++;const[a,d]=open;
      if(cards[a].k===cards[d].k){btns[a].classList.add('done');btns[d].classList.add('done');open=[];matched++;addStar();
        if(matched===ws.length)setTimeout(()=>finish('זיכרון',ws.length,ws.length,()=>memory(cat)),700)}
      else{busy=true;setTimeout(()=>{[a,d].forEach(x=>{btns[x].classList.remove('up');btns[x].textContent='?'});open=[];busy=false},900)}}
  });
}

/* ---------- order / sequence ---------- */
function seq(title,items,hint){
  const exp=items;let pos=0;const tiles=shuffle(items);
  app.innerHTML=`${topbar(title,'')}<p class="center hint">${hint}</p><div class="ans" id="line"></div><div class="letters" id="tl">${tiles.map((t,k)=>`<button class="wd" data-k="${k}">${t}</button>`).join('')}</div>`;
  bindBack();const line=document.getElementById('line');
  app.querySelectorAll('#tl .wd').forEach(b=>b.onclick=()=>{
    const t=tiles[+b.dataset.k];
    if(String(t)===String(exp[pos])){b.disabled=true;b.style.opacity=.2;const s=document.createElement('span');s.className='wd';s.textContent=t;line.appendChild(s);speak(String(t));pos++;
      if(pos===exp.length){addStar(3);toast(rnd(PRAISE));setTimeout(()=>finish(title,exp.length,exp.length,()=>seq(title,items,hint)),900)}}
    else{b.classList.add('shake');setTimeout(()=>b.classList.remove('shake'),400)}
  });
}

/* ---------- build a sentence ---------- */
function build(){
  const list=shuffle(SENT).slice(0,8);let i=0,good=0;
  function next(){
    if(i>=list.length)return finish('בנו משפט',good,list.length,build);
    const s=list[i],words=s.en.replace(/\.$/,'').split(' '),tiles=shuffle(words.map((w,k)=>({k,w})));let placed=[],fails=0;
    function draw(){
      app.innerHTML=`${topbar('בנו משפט',(i+1)+'/'+list.length)}<div class="bar2"><i style="width:${i/list.length*100}%"></i></div>
      <div class="card q"><div class="hint">כתבו באנגלית:</div><div class="prompt" style="font-size:1.5rem">${s.he}</div></div>
      <div class="ans" id="ans">${placed.map(t=>`<button class="wd" data-p="${t.k}">${t.w}</button>`).join('')}</div>
      <div class="letters">${tiles.filter(t=>!placed.includes(t)).map(t=>`<button class="wd" data-t="${t.k}">${t.w}</button>`).join('')}</div>`;
      bindBack();
      app.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{placed.push(tiles.find(t=>t.k===+b.dataset.t));check()});
      app.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{placed=placed.filter(t=>t.k!==+b.dataset.p);draw()});
    }
    function check(){
      if(placed.length<tiles.length)return draw();
      if(placed.map(t=>t.w).join(' ')===words.join(' ')){draw();if(!fails){good++;addStar()}toast(rnd(PRAISE));speak(s.en);setTimeout(()=>{i++;next()},1300)}
      else{fails++;draw();const a=document.getElementById('ans');a.classList.add('shake');setTimeout(()=>{placed=[];draw()},700)}
    }
    draw();speak(s.en);
  }
  next();
}

/* ---------- reference tables ---------- */
function tables(){
  app.innerHTML=`${topbar('טבלאות עזר')}
  <div class="card"><b>have / has</b> — יש ל־<table class="en"><tr><td>I have</td><td>He has</td></tr><tr><td>You have</td><td>She has</td></tr><tr><td>We have</td><td>It has</td></tr><tr><td>They have</td><td></td></tr></table></div>
  <div class="card" style="margin-top:12px"><b>to be</b> — am / is / are<table class="en"><tr><th>I</th><td>am</td><td>I'm</td></tr><tr><th>He / She / It</th><td>is</td><td>He's / She's / It's</td></tr><tr><th>We / You / They</th><td>are</td><td>We're / You're / They're</td></tr></table></div>
  <div class="card" style="margin-top:12px"><b>12 months</b><div class="en" style="line-height:2">${M.map(m=>m[0]).join(' · ')}</div></div>`;
  bindBack();
}

/* ---------- home ---------- */
function home(){
  const g=(ic,t,sub,id)=>`<button class="tile" data-g="${id}"><span class="ic">${ic}</span>${t}${sub?`<small>${sub}</small>`:''}</button>`;
  app.innerHTML=`
  <h2>📚 מילים</h2>
  <div class="chips">${CATS.map(([k,t])=>`<button class="chip ${CAT===k?'on':''}" data-c="${k}">${t}</button>`).join('')}</div>
  <div class="grid">
   ${g('🃏','כרטיסיות','','fc')}${g('❓','חידון מילים','','wq')}${g('✏️','איות','הקשיבו וכתבו','sp')}${g('🧠','זיכרון','זוגות','mem')}
  </div>
  <h2>🔢 מספרים וחודשים</h2>
  <div class="grid">
   ${g('🔟','חידון מספרים','1–100','nq')}${g('📅','חידון חודשים','','mq')}${g('1️⃣','סדרו מספרים','10–100','sn')}${g('🗓️','סדרו חודשים','ינואר–דצמבר','sm')}
  </div>
  <h2>🧩 דקדוק</h2>
  <div class="grid">
   ${g('🔵','have / has','הקיפו את המילה','ch')}${g('🟢','am / is / are','הקיפו את המילה','cb')}
   ${g('🗂️','מיון have / has','מי הולך עם מה?','sh')}${g('🗂️','מיון am / is / are','מי הולך עם מה?','sb')}
   ${g('✂️','<span class="en">I\'m, He\'s</span>','צורות מקוצרות','sf')}${g('📖','טבלאות','עזרה','tb')}
  </div>
  <h2>💬 משפטים</h2>
  <div class="grid">${g('🧱','בנו משפט','סדרו את המילים','bd')}${g('🔁','תרגמו','בחרו תרגום','tr')}</div>`;
  const act={fc:()=>flashcards(CAT),wq:()=>wordQuiz(CAT),sp:()=>spell(CAT),mem:()=>memory(CAT),
   nq:()=>wordQuiz('n'),mq:()=>wordQuiz('m'),sn:()=>seq('סדרו מספרים',N.filter(x=>x[1]>=10&&x[1]%10===0).map(x=>x[0]),'לחצו לפי הסדר: מהקטן לגדול'),sm:()=>seq('סדרו חודשים',M.map(m=>m[0]),'לחצו לפי הסדר: מינואר עד דצמבר'),
   ch:()=>circle('have','have / has'),cb:()=>circle('be','am / is / are'),sh:()=>sortGame('have','מיון have / has'),sb:()=>sortGame('be','מיון am / is / are'),
   sf:shortForms,tb:tables,bd:build,tr:translateGame};
  app.querySelectorAll('[data-g]').forEach(b=>b.onclick=act[b.dataset.g]);
  app.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{CAT=b.dataset.c;home()});
}
try{speechSynthesis.getVoices()}catch(e){}
drawStars();home();
</script>
